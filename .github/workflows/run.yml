name: Update chart

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update_chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync

      - name: Run notebook
        run: uv run jupyter nbconvert --to notebook --execute --inplace notebooks/bitcoin.ipynb

      - name: Generate interactive chart HTML
        run: |
          mkdir -p _site
          uv run python -c "
          from btc_cycles import Bitcoin
          btc = Bitcoin(source='coinmarketcap-free')
          fig = btc.plot(kind='interactive', from_date='2012-11-28')
          fig.write_html('_site/index.html', config={'scrollZoom': True, 'displayModeBar': True})
          "

      - name: Check for chart changes
        id: changes
        run: |
          if git diff --quiet notebooks/bitcoin.png; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get current time
        if: steps.changes.outputs.changed == 'true'
        uses: josStorer/get-current-time@v2
        id: current-time

      # main is ruleset-protected: open an auto-merging PR instead of pushing.
      # The release-please App token (unlike GITHUB_TOKEN) triggers CI on the PR.
      - name: Mint App token
        if: steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RP_APP_ID }}
          private-key: ${{ secrets.RP_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open auto-merging PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MESSAGE: "Update chart:${{ steps.current-time.outputs.readableTime }}"
          BRANCH: bot/daily-chart
          TITLE: "chore(data): update daily chart"
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git switch -C "$BRANCH"
          git add -A notebooks
          git commit -m "$MESSAGE"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "Daily chart refresh by the \`Update chart\` workflow."
          fi
          gh pr merge "$BRANCH" --auto --squash --delete-branch

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
